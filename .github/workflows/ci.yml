name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-aws.lock '.[aws]'
      - run: python -m unittest discover -s tests -v
      - name: PHP SSM inventory and approval gates (offline)
        run: python -m unittest discover -s php-ssm/tests -v
      - name: Offline demo must report findings
        shell: bash
        run: |
          set +e
          python -m auditor --snapshot examples/inventory.json --output reports/demo
          result=$?
          set -e
          test "$result" -eq 1
          python -c "import json; r=json.load(open('reports/demo/report.json')); assert r['complete']; assert len(r['findings']) == 4"
      - name: Installed CLI entry point
        run: aws-governance-audit --help
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.1'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
